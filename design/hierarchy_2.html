<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Список чатов</title>
<style>
  /* ===== Палитра прошлой темы — без изменений ===== */
  :root{
    --bg:#ffffff;
    --sidebar-bg:#f7f7f8;
    --text:#24292f;
    --muted:#6e7781;
    --faint:#9aa1ab;
    --border:#e6e8ec;
    --hover:#eceef1;
    --active-bg:#e7edff;
    --active-text:#1f4bd8;
    --radius:6px;

    /* акценты прошлой версии */
    --folder-icon:#8b80e8;
    --focus-ring:#b9c8ff;
    --action-hover-bg:#dfe3e8;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:14px;
    color:var(--text);
    background:var(--bg);
    display:flex;
  }

  /* ---------- Сайдбар ---------- */
  .sidebar{
    width:300px;
    flex:0 0 300px;
    height:100vh;
    background:var(--sidebar-bg);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
  }
  .sidebar-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 10px 8px 16px;
    font-size:12px;
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--faint);
  }
  .header-action{
    width:24px;height:24px;
    display:flex;align-items:center;justify-content:center;
    border:none;background:transparent;padding:0;
    border-radius:var(--radius);
    color:var(--muted);
    cursor:pointer;
    transition:background .12s ease,color .12s ease;
  }
  .header-action:hover{background:var(--hover);color:var(--text);}

  .tree{
    flex:1;
    overflow-y:auto;
    padding:0 0 16px;
  }

  /* ---------- Узел ---------- */
  .node{}

  .row{
    display:flex;
    align-items:center;
    gap:6px;
    height:32px;
    margin:1px 6px;
    padding:0 6px 0 4px;
    border-radius:var(--radius);
    cursor:pointer;
    user-select:none;
    position:relative;
    outline:none;
  }
  .row:hover{background:var(--hover);}
  .row:focus-visible{box-shadow:inset 0 0 0 2px var(--focus-ring);}
  .row.active{background:var(--active-bg);color:var(--active-text);}
  .row.active .icon{color:var(--active-text);}

  /* Шеврон: только у контейнеров с детьми */
  .chevron{
    flex:0 0 18px;
    width:18px;height:18px;
    display:flex;align-items:center;justify-content:center;
    border:none;background:transparent;padding:0;
    border-radius:4px;
    color:var(--faint);
    cursor:pointer;
  }
  .chevron svg{transition:transform .16s ease;}
  .chevron.expanded svg{transform:rotate(90deg);}
  .chevron.hidden{visibility:hidden;}
  .row:hover .chevron:not(.hidden){color:var(--muted);}

  .icon{
    flex:0 0 18px;
    width:18px;height:18px;
    display:flex;align-items:center;justify-content:center;
    color:var(--muted);
  }
  .node[data-type="folder"] > .row > .icon{color:var(--folder-icon);}

  .label{
    flex:1 1 auto;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:13.5px;
  }
  .row.pinned .label{font-weight:600;}

  /* «+» — только на hover */
  .action{
    flex:0 0 22px;
    width:22px;height:22px;
    display:flex;align-items:center;justify-content:center;
    border:none;background:transparent;padding:0;
    border-radius:5px;
    color:var(--muted);
    cursor:pointer;
    opacity:0;
    transition:opacity .12s ease,background .12s ease,color .12s ease;
  }
  .row:hover .action,
  .row:focus-within .action{opacity:1;}
  .action:hover{background:var(--action-hover-bg);color:var(--text);}

  /* ---------- Вложенность + направляющая линия ---------- */
  .group{
    display:none;
    margin-left:19px;
    border-left:1px solid var(--border);
  }
  .group.open{display:block;}

  .divider{
    height:1px;
    background:var(--border);
    margin:6px 12px;
  }

  /* ---------- Правая часть (демо) ---------- */
  .main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    text-align:center;
    padding:24px;
  }
  .main h1{
    margin:0;
    font-size:18px;
    font-weight:600;
    color:var(--text);
  }
  .main p{
    margin:0;
    font-size:13px;
    color:var(--muted);
  }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-header">
    <span>Чаты</span>
    <button class="header-action" type="button" title="Новая папка"></button>
  </div>
  <div class="tree" id="tree" role="tree" aria-label="Список чатов"></div>
</aside>

<main class="main">
  <h1 id="main-title">Выберите чат</h1>
  <p id="main-sub">Чаты всегда находятся внутри подключений</p>
</main>

<script>
/* =========================================================
   Иконки
   ========================================================= */
const ICONS = {
  chevron:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  plus:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  folder:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.2a2 2 0 0 1 1.5.7L11.5 7h7A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z"/></svg>',
  connection:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2v5"/><path d="M15 2v5"/><path d="M6.5 7h11v2.5a5.5 5.5 0 0 1-11 0z"/><path d="M12 15v7"/></svg>',
  chat:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.5 8.7 8.7 0 0 1-3.9-.9L3 21l1.9-5.6A8.5 8.5 0 1 1 21 11.5z"/></svg>',
  sparkles:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3l1.7 4.6L17.3 9.3l-4.6 1.7L11 15.6 9.3 11 4.7 9.3l4.6-1.7z"/><path d="M18.2 14.4l.7 1.9 1.9.7-1.9.7-.7 1.9-.7-1.9-1.9-.7 1.9-.7z"/></svg>'
};

/* =========================================================
   Данные: общий чат + папки → подключения → чаты
   ========================================================= */
const data = [
  { id:'general', type:'chat', title:'Общий чат с ИИ', pinned:true },
  {
    id:'f1', type:'folder', title:'Работа',
    children:[
      { id:'c1', type:'connection', title:'OpenAI API', children:[
        { id:'ch1', type:'chat', title:'Рефакторинг модуля оплаты' },
        { id:'ch2', type:'chat', title:'Помоги с регуляркой' }
      ]},
      { id:'c2', type:'connection', title:'Claude', children:[
        { id:'ch3', type:'chat', title:'Дизайн лендинга' }
      ]}
    ]
  },
  {
    id:'f2', type:'folder', title:'Личное',
    children:[
      { id:'c3', type:'connection', title:'Локальная модель', children:[] }
    ]
  },
  {
    id:'c4', type:'connection', title:'Тестовый сервер', children:[
      { id:'ch4', type:'chat', title:'Отладка вебхуков' }
    ]
  }
];

const state = {
  expanded: new Set(['f1','c1']),
  activeId: 'ch1'
};

let uid = 0;

/* =========================================================
   Утилиты
   ========================================================= */
function findNode(nodes, id){
  for (const n of nodes){
    if (n.id === id) return n;
    if (n.children){
      const found = findNode(n.children, id);
      if (found) return found;
    }
  }
  return null;
}

function updateMain(){
  const node = findNode(data, state.activeId);
  const title = document.getElementById('main-title');
  const sub   = document.getElementById('main-sub');

  if (node && node.type === 'chat'){
    title.textContent = node.title;
    sub.textContent = node.pinned
      ? 'Общий чат · доступен всегда'
      : 'Чат внутри подключения';
  } else {
    title.textContent = 'Выберите чат';
    sub.textContent = 'Чаты всегда находятся внутри подключений';
  }
}

/* =========================================================
   Рендер узла
   ========================================================= */
function buildNode(node){
  const wrap = document.createElement('div');
  wrap.className = 'node';
  wrap.dataset.type = node.type;
  wrap.dataset.id = node.id;

  const children = node.children || [];
  const hasChildren = children.length > 0;
  const expanded = state.expanded.has(node.id);

  const row = document.createElement('div');
  row.className = 'row'
    + (state.activeId === node.id ? ' active' : '')
    + (node.pinned ? ' pinned' : '');
  row.dataset.id = node.id;
  row.tabIndex = 0;
  row.setAttribute('role','treeitem');
  if (hasChildren) row.setAttribute('aria-expanded', String(expanded));

  const chev = document.createElement('button');
  chev.type = 'button';
  chev.tabIndex = -1;
  chev.setAttribute('aria-hidden','true');
  chev.className = 'chevron'
    + (expanded ? ' expanded' : '')
    + (hasChildren ? '' : ' hidden');
  chev.innerHTML = ICONS.chevron;
  row.appendChild(chev);

  const icon = document.createElement('span');
  icon.className = 'icon';
  icon.innerHTML = node.pinned ? ICONS.sparkles : ICONS[node.type];
  row.appendChild(icon);

  const label = document.createElement('span');
  label.className = 'label';
  label.textContent = node.title;
  row.appendChild(label);

  const addType = node.type === 'folder' ? 'connection'
                : node.type === 'connection' ? 'chat'
                : null;

  if (addType){
    const act = document.createElement('button');
    act.type = 'button';
    act.className = 'action';
    act.title = addType === 'chat' ? 'Новый чат в этом подключении' : 'Добавить подключение в папку';
    act.innerHTML = ICONS.plus;
    act.addEventListener('click', (e) => {
      e.stopPropagation();
      addChild(node, addType);
    });
    row.appendChild(act);
  }

  wrap.appendChild(row);

  let group = null;
  if (hasChildren){
    group = document.createElement('div');
    group.className = 'group' + (expanded ? ' open' : '');
    group.setAttribute('role','group');
    children.forEach(child => group.appendChild(buildNode(child)));
    wrap.appendChild(group);
  }

  const activate = () => {
    if (hasChildren){
      const open = group.classList.toggle('open');
      chev.classList.toggle('expanded', open);
      row.setAttribute('aria-expanded', String(open));
      if (open) state.expanded.add(node.id);
      else state.expanded.delete(node.id);
    }
    if (node.type === 'chat'){
      state.activeId = node.id;
      document.querySelectorAll('.row.active').forEach(r => r.classList.remove('active'));
      row.classList.add('active');
      updateMain();
    }
  };

  row.addEventListener('click', activate);
  row.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      activate();
    }
  });

  return wrap;
}

/* =========================================================
   Добавление элементов
   ========================================================= */
function addChild(parent, type){
  const n = ++uid;
  const id = 'new-' + n;

  if (!parent.children) parent.children = [];

  if (type === 'chat'){
    parent.children.push({ id, type:'chat', title:'Новый чат ' + n });
    state.activeId = id;
  } else {
    parent.children.push({ id, type:'connection', title:'Новое подключение ' + n, children:[] });
  }

  state.expanded.add(parent.id);
  renderTree();
  updateMain();
}

/* =========================================================
   Полный рендер
   ========================================================= */
function renderTree(){
  const tree = document.getElementById('tree');
  tree.innerHTML = '';

  data.forEach(node => {
    tree.appendChild(buildNode(node));
    if (node.pinned){
      const d = document.createElement('div');
      d.className = 'divider';
      tree.appendChild(d);
    }
  });
}

/* =========================================================
   Инициализация
   ========================================================= */
document.querySelector('.header-action').innerHTML = ICONS.plus;
document.querySelector('.header-action').addEventListener('click', () => {
  const n = ++uid;
  const id = 'new-' + n;
  data.push({ id, type:'folder', title:'Новая папка ' + n, children:[] });
  state.expanded.add(id);
  renderTree();
});

renderTree();
updateMain();
</script>
</body>
</html>
